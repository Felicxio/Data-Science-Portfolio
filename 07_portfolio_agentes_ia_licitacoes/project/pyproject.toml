[project]
name = "agente"
version = "0.1.0"
description = "Sistema multi-agente de inteligência para licitações de engenharia"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-community>=0.2.0",
    "chromadb>=0.5.0",
    "pdfplumber>=0.11.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",          # cliente HTTP async — mais seguro que requests
    "tenacity>=8.0.0",        # retry com backoff exponencial
    "structlog>=24.0.0",      # logs estruturados em JSON
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B"]   # S = flake8-bandit (segurança)
ignore  = ["S101"]                    # permite assert em testes

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "--cov=licitacao --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["licitacao", "config"]